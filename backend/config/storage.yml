test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# 公開環境の画像の置き場 (Issue #149)。
# 接続情報は環境変数 CLOUDINARY_URL を gem が読むため、ここには書かない。
# folder は Cloudinary での保存名の頭に付き、このアプリのファイルを 1 か所にまとめる。
cloudinary:
  service: Cloudinary
  folder: trip-diary

