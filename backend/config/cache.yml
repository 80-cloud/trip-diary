default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# 公開環境でも別の DB を指定しない。アプリ本体の DB を使う (Issue #146)。
production:
  <<: *default
